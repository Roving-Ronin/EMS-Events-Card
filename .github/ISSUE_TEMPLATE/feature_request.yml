name: Feature request
description: Suggest an idea for the EM, HAEO or EMHASS Events Card
labels: ['type/feature']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to help improve this project!
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the feature you are requesting.
      options:
        - label: I have searched the existing issues
          required: true
  - type: dropdown
    id: card
    attributes:
      label: Which card?
      description: Which card should this feature apply to?
      options:
        - EM Events Card (Energy Manager)
        - EM Forecast Card
        - HAEO Events Card
        - EMHASS Events Card
        - All cards
    validations:
      required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behaviour
      description: A concise description of what the card does now.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: Desired Behaviour
      description: A concise description of what you would like the card to do. Mock-ups or screenshots are welcome.
      placeholder: Tell us what you would like to see!
    validations:
      required: true
  - type: textarea
    attributes:
      label: Possible Solutions
      description: If you have an idea on how to implement this, e.g. which sensor or attribute holds the data, please let us know.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Context / Reason
      description: Providing context helps us come up with a solution that is most useful in the real world.
    validations:
      required: true
