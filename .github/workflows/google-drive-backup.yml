name: Backup to Google Drive

# Uploads a full git bundle (all branches, tags and history) to Google Drive
# with rclone, then applies retention: always keep the newest 10 backups, and
# trash any older ones that are more than 90 days old.
#
# Requires one repository secret:
#   RCLONE_CONF  the contents of an rclone.conf containing a Google Drive
#                remote named "gdrive" (see the setup notes in the README/PR).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdrive-backup
  cancel-in-progress: false

env:
  REMOTE_DIR: "gdrive:GitHub-Backups/${{ github.event.repository.name }}"
  PREFIX: "Github-${{ github.event.repository.name }}-"
  KEEP_MIN: 10
  KEEP_DAYS: 90

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the secret is set
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "::error::RCLONE_CONF secret is missing or empty."
            exit 1
          fi

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Write rclone config
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes | grep -qx 'gdrive:' || {
            echo "::error::rclone.conf has no remote named 'gdrive'."
            exit 1
          }

      - name: Create git bundle
        run: |
          # Make every remote branch a local branch so the bundle restores cleanly
          for b in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$'); do
            git show-ref --verify --quiet "refs/heads/$b" || git branch --quiet "$b" "origin/$b"
          done
          NAME="${PREFIX}$(TZ=Australia/Sydney date +'%Y-%m-%d_%H%M%S').bundle"
          git bundle create "$NAME" HEAD --branches --tags
          git bundle verify "$NAME"
          ls -lh "$NAME"
          echo "BUNDLE=$NAME" >> "$GITHUB_ENV"

      - name: Upload to Google Drive
        run: |
          rclone copyto "$BUNDLE" "$REMOTE_DIR/$BUNDLE" --progress=false --stats-one-line -v

      - name: Apply retention (keep newest 10, trash others older than 90 days)
        run: |
          CUTOFF=$(date -u -d "-${KEEP_DAYS} days" +%s)
          rclone lsjson "$REMOTE_DIR" --files-only > listing.json
          echo "Backups in Drive: $(jq --arg p "$PREFIX" '[.[] | select(.Name | startswith($p))] | length' listing.json)"

          jq -r --arg p "$PREFIX" --argjson keep "$KEEP_MIN" --argjson cutoff "$CUTOFF" '
            [ .[] | select((.Name | startswith($p)) and (.Name | endswith(".bundle"))) ]
            | sort_by(.ModTime) | reverse
            | .[$keep:]
            | .[] | select((.ModTime | sub("\\.[0-9]+"; "") | fromdateiso8601) < $cutoff)
            | .Name' listing.json > to-delete.txt

          if [ ! -s to-delete.txt ]; then
            echo "Nothing to remove."
            exit 0
          fi
          while IFS= read -r f; do
            echo "Trashing $f"
            rclone deletefile "$REMOTE_DIR/$f"   # Drive moves it to Trash by default
          done < to-delete.txt
