name: Update versions.json

# Keeps versions.json in sync with the version constant in each card's JS.
# The README version badges read versions.json, so the JS file is the only
# place a card's version is ever set by hand.

on:
  push:
    branches:
      - main
    paths:
      - src/em-events-card.js
      - src/em-forecast-card.js
      - src/haeo-events-card.js
      - src/emhass-events-card.js
      - versions.json
  schedule:
    # Daily safety net: 17:23 UTC = 04:23 AEDT / 03:23 AEST
    - cron: "23 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-versions
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version constants from the card files
        run: |
          read_version() {
            # $1 = file, $2 = constant name
            v=$(grep -oP "const $2 = '\Kv[0-9]+\.[0-9]+\.[0-9]+" "$1" | head -1)
            if [ -z "$v" ]; then
              echo "::error file=$1::Could not find $2 = 'vX.Y.Z' in $1"
              exit 1
            fi
            echo "$v"
          }

          EM=$(read_version src/em-events-card.js _EMEC_VERSION)
          EMFC=$(read_version src/em-forecast-card.js _EMFC_VERSION)
          HAEO=$(read_version src/haeo-events-card.js _HAEO_VERSION)
          EMHASS=$(read_version src/emhass-events-card.js _EMHASS_VERSION)

          printf '{\n  "em": "%s",\n  "em_forecast": "%s",\n  "haeo": "%s",\n  "emhass": "%s"\n}\n' \
            "$EM" "$EMFC" "$HAEO" "$EMHASS" > versions.json

          echo "EM: $EM  EM Forecast: $EMFC  HAEO: $HAEO  EMHASS: $EMHASS"
          cat versions.json

      - name: Commit versions.json if it changed
        run: |
          if git diff --quiet -- versions.json; then
            echo "versions.json already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "Update versions.json from card version constants"
          git push
